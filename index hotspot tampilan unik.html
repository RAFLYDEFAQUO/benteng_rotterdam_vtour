<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jelajah Sejarah Benteng Rotterdam</title>
  <!-- Pannellum loads from the CDN; an internet connection is required. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
  <style>
    * { box-sizing: border-box; }
    :root {
      --navy: #17243a;
      --navy-deep: #0f172a;
      --gold: #d6ad72;
      --paper: #fffaf2;
      --ink: #263247;
    }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, Helvetica, sans-serif;
      background: var(--navy-deep);
      color: #fff;
    }
    header {
      padding: 16px 22px;
      background: linear-gradient(120deg, #17243a, #263b54);
      border-bottom: 3px solid var(--gold);
    }
    h1 { margin: 0; font-size: clamp(1.15rem, 2vw, 1.55rem); letter-spacing: .2px; }
    .intro { margin: 7px 0 0; color: #d3e2f1; font-size: .92rem; line-height: 1.5; }
    #panorama { width: 100%; height: calc(100vh - 126px); min-height: 380px; }
    footer {
      min-height: 46px;
      padding: 13px 22px;
      background: #17243a;
      color: #cbd5e1;
      font-size: .86rem;
      border-top: 1px solid rgba(214, 173, 114, .35);
    }
    footer span { color: var(--gold); font-weight: bold; }

    /* Kartu tooltip Pannellum: lebih lebar dan nyaman untuk teks panjang. */
    #panorama .pnlm-tooltip {
      z-index: 20 !important;
      width: min(340px, 78vw) !important;
      max-width: min(340px, 78vw) !important;
      padding: 14px 16px !important;
      border: 1px solid rgba(214, 173, 114, .9) !important;
      border-radius: 14px !important;
      background: rgba(255, 250, 242, .98) !important;
      color: var(--ink) !important;
      box-shadow: 0 12px 34px rgba(0, 0, 0, .32) !important;
      font-size: 14px !important;
      line-height: 1.65 !important;
      text-align: left !important;
      white-space: normal !important;
      overflow-wrap: anywhere !important;
    }
    #panorama .pnlm-tooltip span {
      display: block !important;
      max-width: 100% !important;
      color: var(--ink) !important;
      white-space: normal !important;
      overflow-wrap: anywhere !important;
      line-height: 1.65 !important;
      text-align: left !important;
    }
    #panorama .pnlm-hotspot.pnlm-info {
      border-radius: 50%;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, .45));
      transition: transform .18s ease, filter .18s ease;
    }
    #panorama .pnlm-hotspot.pnlm-info:hover {
      transform: scale(1.12);
      filter: drop-shadow(0 0 7px rgba(214, 173, 114, .9));
    }
    @media (max-width: 600px) {
      header { padding: 13px 15px; }
      #panorama { height: calc(100vh - 136px); min-height: 360px; }
      #panorama .pnlm-tooltip {
        width: min(280px, 74vw) !important;
        max-width: min(280px, 74vw) !important;
        padding: 11px 12px !important;
        font-size: 13px !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Jelajah Sejarah Benteng Rotterdam</h1>
    <p class="intro">Geser panorama untuk melihat sekeliling. Pilih panah untuk berpindah lokasi dan ikon informasi untuk membaca cerita di setiap titik.</p>
  </header>
  <main><div id="panorama" aria-label="Interactive 360-degree campus tour"></div></main>
  <footer>Virtual tour interaktif · <span>Benteng Rotterdam</span> · Jelajahi setiap titik untuk mengenal ceritanya.</footer>

  <script>
    pannellum.viewer("panorama", {
      "default": {
        "firstScene": "gerbang_masuk",
        "sceneFadeDuration": 700,
        "autoLoad": true,
        "hfov": 110,
        "escapeHTML": true
      },
      "scenes": {
        "gerbang_masuk": {
          "title": "Gerbang Masuk",
          "type": "equirectangular",
          "panorama": "images/gerbang_masuk.jpg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": 0, "yaw": 0, "type": "scene", "text": "Go to jalan dari gerbang", "sceneId": "jalan_dari_gerbang"},
            {"pitch": 10, "yaw": -50, "type": "info", "text": "Gerbang Masuk — Selamat datang di Benteng Rotterdam, salah satu situs bersejarah penting di Kota Makassar, Sulawesi Selatan. Benteng ini memiliki sejarah panjang yang berkaitan dengan Kerajaan Gowa dan masa kolonial Belanda. Melalui tur virtual ini, mari mengenal lebih dekat sejarah dan warisan budaya yang tersimpan di dalamnya."}
          ]
        },
        "jalan_dari_gerbang": {
          "title": "Jalan Dari Gerbang",
          "type": "equirectangular",
          "panorama": "images/jalan_dari_gerbang.jpg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": 0, "yaw": 0, "type": "scene", "text": "Go to Bangunan Melengkung", "sceneId": "bangunan_melengkung"},
            {"pitch": -6, "yaw": -110, "type": "scene", "text": "Back to Gerbang Masuk", "sceneId": "gerbang_masuk"},
            {"pitch": 8, "yaw": 3, "type": "info", "text": "Jalan dari Gerbang — Area ini menjadi bagian awal perjalanan pengunjung setelah memasuki kompleks Benteng Rotterdam. Dari jalur ini, pengunjung dapat mulai mengamati suasana lingkungan dan bangunan bersejarah di sekitarnya. Mari mengenal kawasan ini dan memahami pentingnya menjaga peninggalan sejarah sebagai bagian dari warisan budaya."}
          ]
        },
        "bangunan_melengkung": {
          "title": "Bangunan Melengkung",
          "type": "equirectangular",
          "panorama": "images/bangunan_melengkung.jpg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": 0, "yaw": 0, "type": "scene", "text": "Go to Jalan Tengah Halaman", "sceneId": "jalan_tengah_halaman"},
            {"pitch": -6, "yaw": -110, "type": "scene", "text": "Back to Jalan dari Gerbang", "sceneId": "jalan_dari_gerbang"},
            {"pitch": 8, "yaw": 3, "type": "info", "text": "Bangunan Melengkung — Benteng Rotterdam memiliki kompleks bangunan dengan karakter arsitektur yang berkembang sepanjang sejarahnya. Bentuk, bahan, pintu, jendela, dan bagian-bagian bangunan menjadi petunjuk untuk memahami cara ruang di dalam benteng pernah digunakan. Amati bangunan ini dan perhatikan detail yang membedakannya dari bangunan di sekitarnya."}
          ]
        },
        "jalan_tengah_halaman": {
          "title": "Jalan Tengah Halaman",
          "type": "equirectangular",
          "panorama": "images/jalan_tengah_halaman.jpg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": 0, "yaw": 0, "type": "scene", "text": "Go to Sisi Bangunan", "sceneId": "sisi_bangunan"},
            {"pitch": -6, "yaw": -110, "type": "scene", "text": "Back to Bangunan Melengkung", "sceneId": "bangunan_melengkung"},
            {"pitch": 8, "yaw": 3, "type": "info", "text": "Jalan Tengah Halaman — Bagian tengah kompleks membantu pengunjung melihat keterhubungan berbagai bangunan di dalam benteng. Jalur dan halaman menjadi bagian dari pengalaman menjelajahi kawasan bersejarah ini. Saat melewati area ini, pengunjung dapat mengamati bagaimana bangunan, jalan, dan ruang terbuka membentuk satu kesatuan lingkungan."}
          ]
        },
        "sisi_bangunan": {
          "title": "Sisi Bangunan",
          "type": "equirectangular",
          "panorama": "images/sisi_bangunan.jpg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": 0, "yaw": 0, "type": "scene", "text": "Go to Arkade dan Taman Kecil", "sceneId": "arkade_dan_taman_kecil"},
            {"pitch": -6, "yaw": -110, "type": "scene", "text": "Back to Jalan Tengah Halaman", "sceneId": "jalan_tengah_halaman"},
            {"pitch": 8, "yaw": 3, "type": "info", "text": "Sisi Bangunan — Bagian ini menjadi kesempatan untuk mengamati lebih dekat kondisi fisik kompleks Benteng Rotterdam. Dinding, bukaan, dan bagian luar bangunan dapat membantu kita mengenali karakter bangunan bersejarah. Keberadaan kawasan ini juga mengingatkan kita akan pentingnya merawat peninggalan sejarah agar tetap dapat dipelajari oleh generasi berikutnya."}
          ]
        },
        "arkade_dan_taman_kecil": {
          "title": "Arkade dan Taman Kecil",
          "type": "equirectangular",
          "panorama": "images/arkade_dan_taman_kecil.jpg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": 0, "yaw": 0, "type": "scene", "text": "Go to Sisi Lapangan Rumpt", "sceneId": "lapangan_rumput"},
            {"pitch": -6, "yaw": -110, "type": "scene", "text": "Back to Sisi Bangunan", "sceneId": "sisi_bangunan"},
            {"pitch": 8, "yaw": 3, "type": "info", "text": "Arkade dan Taman Kecil — Area ini memperlihatkan perpaduan bangunan dan ruang terbuka di dalam kompleks benteng. Bagian seperti ini dapat menjadi tempat pengunjung berhenti sejenak sambil menikmati suasana kawasan bersejarah. Kehadiran ruang terbuka juga mendukung pengalaman wisata yang tidak hanya berfokus pada bangunan, tetapi juga pada lingkungan sekitarnya."}
          ]
        },
        "lapangan_rumput": {
          "title": "Lapangan Rumput",
          "type": "equirectangular",
          "panorama": "images/lapangan_rumput.jpg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": 0, "yaw": 0, "type": "scene", "text": "Go to Arkade Bertiang", "sceneId": "arkade_bertiang"},
            {"pitch": -6, "yaw": -110, "type": "scene", "text": "Back to Arkade dan Taman Kecil", "sceneId": "arkade_dan_taman_kecil"},
            {"pitch": 8, "yaw": 3, "type": "info", "text": "Lapangan Rumput — Area terbuka di dalam kompleks benteng memberikan ruang untuk menikmati suasana dan melihat bangunan dari sudut pandang yang lebih luas. Benteng Rotterdam dikenal sebagai tujuan wisata sejarah dan budaya di Makassar. Kawasan bersejarah seperti ini juga dapat menjadi ruang untuk kegiatan edukasi dan pengenalan warisan budaya."}
          ]
        },
        "arkade_bertiang": {
          "title": "Arkade Bertiang",
          "type": "equirectangular",
          "panorama": "images/arkade_bertiang.jpg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": 0, "yaw": 0, "type": "scene", "text": "Go to Taman Melingkar", "sceneId": "taman_melingkar"},
            {"pitch": -6, "yaw": -110, "type": "scene", "text": "Back to Lapangan Rumput", "sceneId": "lapangan_rumput"},
            {"pitch": 8, "yaw": 3, "type": "info", "text": "Arkade Bertiang — Bagian berarkade dengan deretan tiang merupakan salah satu elemen yang dapat ditemukan pada bangunan di kompleks Benteng Rotterdam. Selain membentuk tampilan bangunan, selasar bertiang juga dapat menjadi area peralihan antara bagian luar dan bagian dalam. Perhatikan bagaimana susunan tiang, atap, dan jalur pejalan kaki membentuk karakter ruang tersebut."}
          ]
        },
        "taman_melingkar": {
          "title": "Taman Melingkar",
          "type": "equirectangular",
          "panorama": "images/taman_melingkar.jpg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": 0, "yaw": 0, "type": "scene", "text": "Go to Lorong Antarbangunan", "sceneId": "lorong_antarbangunan"},
            {"pitch": -6, "yaw": -110, "type": "scene", "text": "Back to Arkade Bertiang", "sceneId": "arkade_bertiang"},
            {"pitch": 8, "yaw": 3, "type": "info", "text": "Taman Melingkar — Area taman menjadi bagian dari pengalaman menikmati lingkungan Benteng Rotterdam. Selain menyimpan nilai sejarah, kawasan benteng juga memiliki daya tarik sebagai tempat untuk mengenal warisan budaya dan menikmati suasana kota. Saat menjelajahi area ini, pengunjung dapat melihat bagaimana ruang terbuka hadir berdampingan dengan bangunan bersejarah."}
          ]
        },
        "lorong_antarbangunan": {
          "title": "Lorong Antarbangunan",
          "type": "equirectangular",
          "panorama": "images/lorong_antarbangunan.jpg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": 0, "yaw": 0, "type": "scene", "text": "Go to Sisi Bangunan Timur", "sceneId": "sisi_bangunan_timur"},
            {"pitch": -6, "yaw": -110, "type": "scene", "text": "Back to Taman Melingkar", "sceneId": "taman_melingkar"},
            {"pitch": 8, "yaw": 3, "type": "info", "text": "Lorong Antarbangunan — Lorong menjadi bagian dari jalur pergerakan pengunjung di antara bangunan-bangunan dalam kompleks. Saat melewatinya, kita dapat melihat lebih dekat hubungan antarruang dan suasana di antara bangunan bersejarah. Lorong juga membantu pengunjung mengenali bahwa Benteng Rotterdam bukan hanya satu bangunan, melainkan kompleks yang memiliki berbagai bagian dengan karakter masing-masing."}
          ]
        },
        "sisi_bangunan_timur": {
          "title": "Sisi Bangunan Timur",
          "type": "equirectangular",
          "panorama": "images/sisi_bangunan_timur.jpg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": 0, "yaw": 0, "type": "scene", "text": "Back to Gerbang Masuk", "sceneId": "gerbang_masuk"},
            {"pitch": -7, "yaw": 100, "type": "scene", "text": "Return to Lorong Antarbangunan", "sceneId": "lorong_antarbangunan"},
            {"pitch": 9, "yaw": 5, "type": "info", "text": "Sisi Bangunan Timur — Bagian ini menjadi salah satu titik akhir perjalanan virtual di Benteng Rotterdam. Setelah menjelajahi berbagai bagian kompleks, kita dapat melihat bahwa benteng ini menyimpan cerita tentang sejarah Makassar, perubahan kekuasaan, perkembangan arsitektur, dan pelestarian warisan budaya. Semoga penjelajahan ini menambah ketertarikan untuk mengenal serta menjaga peninggalan sejarah di sekitar kita."}
          ]
        }
      }
    });
  </script>
</body>
</html>
