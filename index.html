<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Campus 360 Tour</title>
  <!-- Pannellum loads from the CDN; an internet connection is required. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #0f172a; color: #fff; }
    header { padding: 14px 22px; background: #17243a; }
    h1 { margin: 0; font-size: 1.35rem; }
    .intro { margin: 6px 0 0; color: #d3e2f1; font-size: .95rem; }
    #panorama { width: 100%; height: calc(100vh - 116px); min-height: 380px; }
    footer { min-height: 46px; padding: 13px 22px; background: #17243a; color: #cbd5e1; font-size: .86rem; }
    footer span { color: #9bd8f2; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>Benteng Rotterdam | Interactive Virtual Tour</h1>
    <p class="intro">Drag to look around. Click arrows to change locations; click info icons for explanations.</p>
  </header>
  <main><div id="panorama" aria-label="Interactive 360-degree campus tour"></div></main>
  <footer>Built with <span>Pannellum</span>, <span>Git</span> and <span>GitHub Pages</span>.</footer>

  <script>
    pannellum.viewer("panorama", {
      "default": {
        "firstScene": "gerbang_masuk",
        "sceneFadeDuration": 700,
        "autoLoad": true,
        "hfov": 110,
        "escapeHTML": true
      },
      "scenes": {
        "gerbang_masuk": {
          "title": "Gerbang Masuk",
          "type": "equirectangular",
          "panorama": "images/gerbang_masuk.jpg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": 0, "yaw": 0, "type": "scene", "text": "Go to jalan dari gerbang", "sceneId": "jalan_dari_gerbang"},
            {"pitch": 10, "yaw": -50, "type": "info", "text": "Welcome to our virtual Benteng Rotterdam tour!"}
          ]
        },
        "jalan_dari_gerbang": {
          "title": "Jalan Dari Gerbang",
          "type": "equirectangular",
          "panorama": "images/jalan_dari_gerbang.jpg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": 0, "yaw": 0, "type": "scene", "text": "Go to Bangunan Melengkung", "sceneId": "bangunan_melengkung"},
            {"pitch": -6, "yaw": -110, "type": "scene", "text": "Back to Gerbang Masuk", "sceneId": "gerbang_masuk"},
            {"pitch": 8, "yaw": 3, "type": "info", "text": "Students learn and work together here."}
          ]
        },
        "bangunan_melengkung": {
          "title": "Bangunan Melengkung",
          "type": "equirectangular",
          "panorama": "images/bangunan_melengkung.jpg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": 0, "yaw": 0, "type": "scene", "text": "Go to Jalan Tengah Halaman", "sceneId": "jalan_tengah_halaman"},
            {"pitch": -6, "yaw": -110, "type": "scene", "text": "Back to Jalan dari Gerbang", "sceneId": "jalan_dari_gerbang"},
            {"pitch": 8, "yaw": 3, "type": "info", "text": "Students learn and work together here."}
          ]
        },
        "jalan_tengah_halaman": {
          "title": "Jalan Tengah Halaman",
          "type": "equirectangular",
          "panorama": "images/jalan_tengah_halaman.jpg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": 0, "yaw": 0, "type": "scene", "text": "Go to Sisi Bangunan", "sceneId": "sisi_bangunan"},
            {"pitch": -6, "yaw": -110, "type": "scene", "text": "Back to Bangunan Melengkung", "sceneId": "bangunan_melengkung"},
            {"pitch": 8, "yaw": 3, "type": "info", "text": "Students learn and work together here."}
          ]
        },
        "sisi_bangunan": {
          "title": "Sisi Bangunan",
          "type": "equirectangular",
          "panorama": "images/sisi_bangunan.jpg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": 0, "yaw": 0, "type": "scene", "text": "Go to Arkade dan Taman Kecil", "sceneId": "arkade_dan_taman_kecil"},
            {"pitch": -6, "yaw": -110, "type": "scene", "text": "Back to Jalan Tengah Halaman", "sceneId": "jalan_tengah_halaman"},
            {"pitch": 8, "yaw": 3, "type": "info", "text": "Students learn and work together here."}
          ]
        },
        "arkade_dan_taman_kecil": {
          "title": "Arkade dan Taman Kecil",
          "type": "equirectangular",
          "panorama": "images/arkade_dan_taman_kecil.jpg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": 0, "yaw": 0, "type": "scene", "text": "Go to Sisi Lapangan Rumpt", "sceneId": "lapangan_rumput"},
            {"pitch": -6, "yaw": -110, "type": "scene", "text": "Back to Sisi Bangunan", "sceneId": "sisi_bangunan"},
            {"pitch": 8, "yaw": 3, "type": "info", "text": "Students learn and work together here."}
          ]
        },
        "lapangan_rumput": {
          "title": "Lapangan Rumput",
          "type": "equirectangular",
          "panorama": "images/lapangan_rumput.jpg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": 0, "yaw": 0, "type": "scene", "text": "Go to Arkade Bertiang", "sceneId": "arkade_bertiang"},
            {"pitch": -6, "yaw": -110, "type": "scene", "text": "Back to Arkade dan Taman Kecil", "sceneId": "arkade_dan_taman_kecil"},
            {"pitch": 8, "yaw": 3, "type": "info", "text": "Students learn and work together here."}
          ]
        },
        "arkade_bertiang": {
          "title": "Arkade Bertiang",
          "type": "equirectangular",
          "panorama": "images/arkade_bertiang.jpg",
          "yaw": 0,
          "hotSpots": [

            {"pitch": 8, "yaw": 3, "type": "info", "text": "Students learn and work together here."}
          ]
        },
        "taman_melingkar": {
          "title": "Taman Melingkar",
          "type": "equirectangular",
          "panorama": "images/taman_melingkar.jpg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": 0, "yaw": 0, "type": "scene", "text": "Go to Lorong Antarbangunan", "sceneId": "lorong_antarbangunan"},
            {"pitch": -6, "yaw": -110, "type": "scene", "text": "Back to Arkade Bertiang", "sceneId": "arkade_bertiang"},
            {"pitch": 8, "yaw": 3, "type": "info", "text": "Students learn and work together here."}
          ]
        },
        "lorong_antarbangunan": {
          "title": "Lorong Antarbangunan",
          "type": "equirectangular",
          "panorama": "images/lorong_antarbangunan.jpg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": 0, "yaw": 0, "type": "scene", "text": "Go to Sisi Bangunan Timur", "sceneId": "sisi_bangunan_timur"},
            {"pitch": -6, "yaw": -110, "type": "scene", "text": "Back to Taman Melingkar", "sceneId": "taman_melingkar"},
            {"pitch": 8, "yaw": 3, "type": "info", "text": "Students learn and work together here."}
          ]
        },
        "sisi_bangunan_timur": {
          "title": "Sisi Bangunan Timur",
          "type": "equirectangular",
          "panorama": "images/sisi_bangunan_timur.jpg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": 0, "yaw": 0, "type": "scene", "text": "Back to Gerbang Masuk", "sceneId": "gerbang_masuk"},
            {"pitch": -7, "yaw": 100, "type": "scene", "text": "Return to Lorong Antarbangunan", "sceneId": "lorong_antarbangunan"},
            {"pitch": 9, "yaw": 5, "type": "info", "text": "Study resources and reading spaces."}
          ]
        }
      }
    });
  </script>
</body>
</html>
